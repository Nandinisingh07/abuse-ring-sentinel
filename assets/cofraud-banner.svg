<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="260" fill="url(#glow)"/>
  <g stroke="#38bdf8" stroke-width="1.4" opacity="0.55" filter="url(#soft)">
    <line x1="880" y1="90" x2="960" y2="150"/>
    <line x1="960" y1="150" x2="900" y2="220"/>
    <line x1="960" y1="150" x2="1040" y2="110"/>
    <line x1="960" y1="150" x2="1060" y2="200"/>
    <line x1="1040" y1="110" x2="1120" y2="150"/>
  </g>
  <g fill="#38bdf8" opacity="0.9">
    <circle cx="880" cy="90" r="6"/>
    <circle cx="960" cy="150" r="9" fill="#fbbf24"/>
    <circle cx="900" cy="220" r="6"/>
    <circle cx="1040" cy="110" r="6"/>
    <circle cx="1060" cy="200" r="6"/>
    <circle cx="1120" cy="150" r="6"/>
  </g>
  <rect x="0" y="0" width="6" height="300" fill="#38bdf8"/>
  <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="2">COFRAUD</text>
  <text x="72" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Graph-Native Fraud Ring Detection &#183; Cost-Aware, Human-in-the-Loop Decisioning</text>
  <text x="72" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#64748b">Fraud doesn't act alone. Neither should your detection system.</text>
</svg>
